          <button class="btn btn-ghost btn-sm" id="exportBtn">⬇ Ekspor Data (JSON)</button>
          <label class="btn btn-ghost btn-sm" style="cursor:pointer;">⬆ Impor Data<input type="file" id="importFile" accept=".json" style="display:none;"></label>
          <button class="btn btn-danger btn-sm" id="resetBtn">↺ Reset ke Data Contoh</button>
        </div>
      </div>
      <p style="font-size:12px;color:var(--ink-400);">Catatan: pengaturan <b>Waktu Kerja / Shift</b> dan <b>Waktu Stop yang Diizinkan</b> kini ada di menu <b>Input OEE</b> (tab terpisah), bukan di sini lagi.</p>
    `;
    renderCatChips();

    document.getElementById('saveCompanyBtn').onclick = ()=>{
      DB.settings.companyName = document.getElementById('setCompany').value.trim() || DB.settings.companyName;
      saveDB(); toast('Informasi perusahaan disimpan.');
    };
    document.getElementById('saveTargetBtn').onclick = ()=>{
      DB.settings.oeeTargets = {
        oee: (parseFloat(document.getElementById('tOee').value)||85)/100,
        availability: (parseFloat(document.getElementById('tAvail').value)||90)/100,
        performance: (parseFloat(document.getElementById('tPerf').value)||95)/100,
        quality: (parseFloat(document.getElementById('tQual').value)||99)/100,
      };
      saveDB(); toast('Target OEE disimpan.');
    };
    document.getElementById('addCatBtn').onclick = ()=>{
      const inp = document.getElementById('newCatInput');
      const v = inp.value.trim();
      if(!v) return;
      if(!DB.settings.downtimeCategories.includes(v)) DB.settings.downtimeCategories.push(v);
      saveDB(); inp.value=''; renderCatChips(); toast('Kategori ditambahkan.');
    };
    document.getElementById('exportBtn').onclick = ()=>{
      const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'oee-mmi-backup-'+todayStr()+'.json'; a.click();
    };
    document.getElementById('importFile').onchange = (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{ const parsed = JSON.parse(reader.result); DB = parsed; saveDB(); toast('Data berhasil dipulihkan.'); draw(); }
        catch(err){ toast('Berkas tidak valid.', true); }
      };
      reader.readAsText(file);
    };
    document.getElementById('resetBtn').onclick = ()=>{
      if(!confirm('Semua data akan diganti dengan data contoh. Lanjutkan?')) return;
      DB = seedData(); saveDB(); toast('Data direset ke contoh.'); draw();
    };
  }
  function renderCatChips(){
    document.getElementById('catChips').innerHTML = DB.settings.downtimeCategories.map((c,i)=>
      `<span class="chip">${escapeHtml(c)}<button data-idx="${i}">✕</button></span>`).join('');
    document.querySelectorAll('#catChips button').forEach(b=>b.onclick=()=>{
      DB.settings.downtimeCategories.splice(+b.dataset.idx,1); saveDB(); renderCatChips();
    });
  }
  draw();
};

/* =====================================================
   AUTH — Firebase Authentication (email + password)
===================================================== */
function setLoginBusy(busy, label){
  const btn = document.querySelector('#loginForm button[type="submit"]');
  if(btn){ btn.disabled = busy; btn.textContent = busy ? (label||'Memproses…') : 'Masuk'; }
}
function loginErr(msg){
  const box = document.getElementById('loginError');
  box.innerHTML = msg; box.style.display = msg ? 'block' : 'none';
}
function authMessage(code){
  const map = {
    'auth/invalid-email':'Format email tidak valid.',
    'auth/user-not-found':'Akun tidak ditemukan.',
    'auth/wrong-password':'Password salah.',
    'auth/invalid-credential':'Email atau password salah.',
    'auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi beberapa saat.',
    'auth/network-request-failed':'Koneksi jaringan bermasalah.',
    'auth/weak-password':'Password minimal 6 karakter.',
    'auth/email-already-in-use':'Email sudah terdaftar.',
    'auth/operation-not-allowed':'Metode Email/Password belum diaktifkan di Firebase Console.',
  };
  return map[code] || ('Gagal masuk ('+code+').');
}

async function attemptLogin(){
  const email = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  loginErr('');
  if(!FB_READY){
    loginErr('Firebase belum terkonfigurasi. Isi dulu blok <b>FIREBASE_CONFIG</b> di bagian atas <b>index.html</b> sesuai panduan.');
    return;
  }
  setLoginBusy(true);
  try{
    await fbAuth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged akan melanjutkan proses
  }catch(err){
    setLoginBusy(false);
    loginErr(authMessage(err.code||''));
  }
}

/* Dipanggil setelah Firebase Auth memastikan user login. */
async function onSignedIn(user){
  try{
    let profSnap = await fbDb.ref(USERS_PATH+'/'+user.uid).get();
    let prof = profSnap.exists() ? profSnap.val() : null;

    if(!prof){
      // Pengguna pertama pada database kosong otomatis menjadi Manager (admin awal).
      const allSnap = await fbDb.ref(USERS_PATH).get();
      if(!allSnap.exists()){
        prof = {email:user.email, nama:user.email.split('@')[0], role:'manager', area:'Produksi'};
        await fbDb.ref(USERS_PATH+'/'+user.uid).set(prof);
      }else{
        await fbAuth.signOut();
        setLoginBusy(false);
        loginErr('Akun Anda belum memiliki profil/role. Hubungi Manager untuk didaftarkan.');
        return;
      }
    }
    SESSION = {uid:user.uid, id:user.uid, email:user.email, nama:prof.nama, role:prof.role, area:prof.area||''};
    await loadDB();
    await loadUsers();
    setLoginBusy(false);
    showApp();
  }catch(err){
    console.error(err);
    setLoginBusy(false);
    loginErr('Gagal memuat profil: '+(err.message||err.code));
  }
}

function doLogout(){
  if(FB_READY){ try{ fbDb.ref(DATA_PATH).off(); }catch(e){} fbAuth.signOut(); }
  SESSION = null;
  document.getElementById('app').classList.remove('active');
  document.getElementById('app').innerHTML='';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginForm').reset();
  setLoginBusy(false);
  loginErr('');
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  const app = document.getElementById('app');
  app.classList.add('active');
  renderShell();
}

function openResetPassword(){
  const email = document.getElementById('loginUser').value.trim();
  if(!email){ loginErr('Isi email Anda dulu, lalu klik "Lupa password".'); return; }
  if(!FB_READY){ loginErr('Firebase belum terkonfigurasi.'); return; }
  fbAuth.sendPasswordResetEmail(email)
    .then(()=>{ loginErr('Tautan atur ulang password sudah dikirim ke '+escapeHtml(email)+'.'); })
    .catch(err=>loginErr(authMessage(err.code||'')));
}

/* =====================================================
   PENGATURAN KONEKSI FIREBASE (dari layar, tanpa edit berkas)
===================================================== */
function parseFirebaseConfig(text){
  // menerima tempelan mentah dari Firebase Console, baik objek JS maupun JSON
  const keys = ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId','measurementId'];
  const out = {};
  keys.forEach(k=>{
    const m = text.match(new RegExp('["\\\']?'+k+'["\\\']?\\s*:\\s*["\\\']([^"\\\']+)["\\\']'));
    if(m) out[k] = m[1].trim();
  });
  return out;
}
function openConfigModal(){
  const cur = readSavedConfig() || (typeof FIREBASE_CONFIG !== 'undefined' ? FIREBASE_CONFIG : {});
  const pretty = isPlaceholder(cur) ? '' : JSON.stringify(cur, null, 2);
  openModal('Atur Koneksi Firebase', `
    <p style="font-size:13px;color:var(--ink-200);line-height:1.6;margin-bottom:14px;">
      Tempelkan objek <b>firebaseConfig</b> dari Firebase Console
      (Project settings → Your apps → Config). Konfigurasi disimpan di browser ini,
      sehingga aplikasi tetap terhubung walau blok <code>FIREBASE_CONFIG</code> di index.html belum diisi.
    </p>
    <div class="field">
      <label>KONFIGURASI FIREBASE</label>
      <textarea id="cfgText" rows="10" style="width:100%;background:var(--ink-850);border:1px solid var(--ink-700);color:var(--paper);padding:11px 13px;border-radius:4px;font-family:var(--font-mono);font-size:12px;resize:vertical;" placeholder='{\n  "apiKey": "AIza...",\n  "authDomain": "oee-mmi.firebaseapp.com",\n  "databaseURL": "https://oee-mmi-default-rtdb.asia-southeast1.firebasedatabase.app",\n  "projectId": "oee-mmi",\n  "storageBucket": "oee-mmi.appspot.com",\n  "messagingSenderId": "1234567890",\n  "appId": "1:1234567890:web:abc"\n}'>${escapeHtml(pretty)}</textarea>
    </div>
    <div id="cfgMsg" style="font-size:12.5px;line-height:1.55;margin-top:4px;"></div>
    <div class="form-actions">
      ${readSavedConfig()?`<button type="button" class="btn btn-ghost" id="cfgClear">Hapus Konfigurasi</button>`:''}
      <button type="button" class="btn btn-ghost" id="cfgCancel">Batal</button>
      <button type="button" class="btn btn-primary" id="cfgSave">Simpan &amp; Hubungkan</button>
    </div>`, {wide:true});
  document.getElementById('cfgCancel').onclick = closeModal;
  const clr = document.getElementById('cfgClear');
  if(clr) clr.onclick = ()=>{ localStorage.removeItem(CFG_KEY); location.reload(); };
  document.getElementById('cfgSave').onclick = ()=>{
    const msg = document.getElementById('cfgMsg');
    const cfg = parseFirebaseConfig(document.getElementById('cfgText').value);
    const missing = ['apiKey','authDomain','databaseURL','projectId','appId'].filter(k=>!cfg[k]);
    if(missing.length){
      msg.innerHTML = '<span style="color:var(--bad)">Belum lengkap — bagian berikut tidak terbaca: <b>'+missing.join(', ')+'</b>. Salin ulang seluruh objek dari Firebase Console.</span>';
      return;
    }
    if(!/^https:\/\/.+firebasedatabase\.app|^https:\/\/.+firebaseio\.com/.test(cfg.databaseURL)){
      msg.innerHTML = '<span style="color:var(--bad)">Format <b>databaseURL</b> tidak dikenali. Salin dari halaman Realtime Database.</span>';
      return;
    }
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    msg.innerHTML = '<span style="color:var(--good)">Tersimpan. Memuat ulang aplikasi…</span>';
    setTimeout(()=>location.reload(), 700);
  };
}

/* Uji koneksi: memeriksa SDK, konfigurasi, jangkauan database, dan status Auth */
async function openDiagnostics(){
  const d = diagnose();
  const line = (ok, label, detail)=>`<div style="display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--ink-800);font-size:13px;">
      <span style="flex-shrink:0">${ok?'✅':'❌'}</span><div><b>${label}</b>${detail?`<div style="color:var(--ink-200);font-size:12.3px;margin-top:2px;">${detail}</div>`:''}</div></div>`;
  openModal('Uji Koneksi', `<div id="diagBody">
      ${line(d.sdk,'SDK Firebase termuat', d.sdk?'':'Tidak dapat mengunduh SDK dari gstatic.com.')}
      ${line(d.cfgFile||d.saved,'Konfigurasi ditemukan', d.saved?'Sumber: disimpan di browser ini.':(d.cfgFile?'Sumber: blok FIREBASE_CONFIG di index.html':'Blok FIREBASE_CONFIG di index.html tidak terbaca.'))}
      ${line(d.cfgFilled,'Konfigurasi sudah diisi', d.cfgFilled?('Project ID: <code>'+escapeHtml(d.config.projectId||'–')+'</code>'):'Masih berisi teks contoh GANTI_…')}
      ${line(d.dbUrl,'databaseURL valid', d.config&&d.config.databaseURL?('<code>'+escapeHtml(d.config.databaseURL)+'</code>'):'Belum terisi.')}
      ${line(d.protocol!=='file:','Dijalankan lewat server web', d.protocol==='file:'?'Halaman dibuka sebagai file:// — Firebase Auth akan menolak.':('Protokol: '+d.protocol))}
      <div id="diagLive" style="padding:10px 0;font-size:13px;color:var(--ink-200);">⏳ Menguji sambungan ke database…</div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="diagCfg">⚙ Atur Konfigurasi</button>
      <button type="button" class="btn btn-primary" id="diagClose">Tutup</button>
    </div>`, {wide:true});
  document.getElementById('diagClose').onclick = closeModal;
  document.getElementById('diagCfg').onclick = ()=>{ closeModal(); openConfigModal(); };

  const live = document.getElementById('diagLive');
  if(!FB_READY){ live.innerHTML = '❌ <b>Sambungan database belum dapat diuji</b> — perbaiki dulu poin bertanda ❌ di atas.'; return; }
  try{
    const t = setTimeout(()=>{ live.innerHTML='⚠️ <b>Belum ada balasan dari database</b> — periksa databaseURL dan Rules.'; }, 6000);
    await fbDb.ref('.info/serverTimeOffset').get();
    clearTimeout(t);
    live.innerHTML = '✅ <b>Database terjangkau.</b> Silakan masuk memakai akun Firebase Anda.';
  }catch(err){
    const perm = (err.code==='PERMISSION_DENIED' || /permission/i.test(err.message||''));
    live.innerHTML = perm
      ? '⚠️ <b>Database terjangkau, tetapi akses ditolak.</b> Ini normal sebelum login — pastikan Rules sudah di-publish, lalu coba masuk.'
      : ('❌ <b>Gagal menjangkau database:</b> '+escapeHtml(err.message||err.code));
  }
}

/* =====================================================
   BOOTSTRAP
===================================================== */
async function boot(){
  buildLoginSvg();
  tickClock();
  document.getElementById('loginForm').addEventListener('submit', (e)=>{ e.preventDefault(); attemptLogin(); });
  const rp = document.getElementById('resetPassLink');
  if(rp) rp.addEventListener('click', (e)=>{ e.preventDefault(); openResetPassword(); });
  const cl = document.getElementById('cfgLink');
  if(cl) cl.addEventListener('click', (e)=>{ e.preventDefault(); openConfigModal(); });
  const dl = document.getElementById('diagLink');
  if(dl) dl.addEventListener('click', (e)=>{ e.preventDefault(); openDiagnostics(); });

  const ok = await initFirebase();
  if(!ok){
    setConnBadge('local','● Belum terhubung');
    const list = FB_DIAG.problems.map(p=>'<li style="margin-top:4px;">'+p+'</li>').join('');
    loginErr('<b>Belum terhubung ke Firebase.</b><ul style="margin:8px 0 8px 18px;padding:0;">'+list+'</ul>'
      + 'Cara tercepat: klik <b>⚙ Atur koneksi Firebase</b> di bawah, lalu tempelkan konfigurasi dari Firebase Console.');
    DB = seedData(); ensureShape(); snapshotShadow();
    return;
  }
  setConnBadge('connecting','● Menghubungkan…');
  fbDb.ref('.info/connected').on('value', s=>{
    setConnBadge(s.val()?'online':'offline', s.val()?'● Online':'● Offline');
  });
  fbAuth.onAuthStateChanged(user=>{
    if(user){ onSignedIn(user); }
    else{
      document.getElementById('loginScreen').style.display='flex';
      document.getElementById('app').classList.remove('active');
      setLoginBusy(false);
    }
  });
}
boot();
