<style>
:root{
  /* Permukaan — dari kanvas paling belakang ke elemen paling menonjol */
  --ink-950:#f4f3fa;   /* latar halaman */
  --ink-900:#ffffff;   /* kartu, sidebar, topbar */
  --ink-850:#f2f0fb;   /* isian input, baris hover */
  --ink-800:#e8e5f5;   /* garis lembut, track bar */
  --ink-700:#dcd8ee;   /* garis tepi */
  --ink-600:#c3bde0;   /* garis tegas */
  --ink-400:#817ca0;   /* teks paling redup */
  --ink-200:#585373;   /* teks sekunder */
  --paper:#241f3d;     /* teks utama */
  --paper-dim:#3c3660;
  --brass:#6a55c4;     /* aksen utama — violet parfum */
  --brass-bright:#8168dd;
  --brass-dim:#4c3b96;
  --teal:#2f8f89;
  --teal-bright:#3aa89f;
  --good:#3d8f63;
  --warn:#c08a22;
  --bad:#c4503f;
  --shadow-s:0 1px 2px rgba(36,31,61,.05), 0 2px 8px rgba(36,31,61,.04);
  --shadow-m:0 2px 6px rgba(36,31,61,.06), 0 10px 26px rgba(36,31,61,.07);
  --shadow-l:0 18px 50px rgba(36,31,61,.16);
  --ease:cubic-bezier(.22,.8,.3,1);
  --radius-s:4px;
  --radius-m:8px;
  --radius-l:14px;
  --font-display:'Space Grotesk', 'IBM Plex Sans', sans-serif;
  --font-ui:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
:root:not([data-theme="light"]){ color-scheme: dark; }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-ui);
  background:var(--ink-950);
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
::selection{background:var(--brass); color:var(--ink-950);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--ink-900);}
::-webkit-scrollbar-thumb{background:var(--ink-600); border-radius:8px;}

/* =====================================================
   LOGIN SCREEN
===================================================== */
#loginScreen{
  position:fixed; inset:0;
  display:flex; align-items:stretch;
  background:var(--ink-950);
  z-index:50;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.login-visual{
  position:relative;
  flex:1.3;
  overflow:hidden;
  background:linear-gradient(170deg,#efeafb 0%, #e6f1f0 55%, #f6f4fc 100%);
  display:flex; align-items:flex-end;
}
.login-visual svg{width:100%; height:100%; display:block;}
.login-visual .visual-caption{
  position:absolute; left:40px; bottom:36px; right:40px;
  font-family:var(--font-mono);
  color:var(--ink-400);
  font-size:12px; letter-spacing:.02em;
  display:flex; justify-content:space-between; gap:12px;
  border-top:1px solid var(--ink-700);
  padding-top:12px;
}
.login-visual .brand-mark{
  position:absolute; top:40px; left:40px;
  font-family:var(--font-display); font-weight:700; font-size:22px;
  letter-spacing:.01em; color:var(--paper);
  display:flex; align-items:center; gap:10px;
}
.login-visual .brand-mark .dot{width:9px; height:9px; border-radius:50%; background:var(--brass-bright); box-shadow:0 0 0 4px rgba(129,104,221,.18);}
.login-pane{
  width:460px; max-width:92vw;
  background:var(--ink-900);
  display:flex; flex-direction:column; justify-content:center;
  padding:56px 48px;
  border-left:1px solid var(--ink-700);
  position:relative; z-index:2;
}
.login-pane h1{
  font-family:var(--font-display); font-size:28px; font-weight:600;
  line-height:1.2; margin-bottom:6px;
}
.login-pane .sub{color:var(--ink-200); font-size:14px; margin-bottom:36px;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:12px; color:var(--ink-200); margin-bottom:6px; font-family:var(--font-mono);}
.field input, .field select{
  width:100%; background:var(--ink-850); border:1px solid var(--ink-700);
  color:var(--paper); padding:11px 13px; border-radius:var(--radius-s);
  font-size:14.5px; transition:border-color .15s;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--brass);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:var(--radius-s); padding:11px 18px;
  font-size:14px; font-weight:600; transition:filter .15s, transform .1s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--brass); color:var(--ink-950);}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent; color:var(--paper); border:1px solid var(--ink-600);}
.btn-ghost:hover{border-color:var(--brass);}
.btn-danger{background:var(--bad); color:var(--paper);}
.btn-block{width:100%;}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.login-error{
  background:#fdeeeb; border:1px solid #efb9af; color:#9c3a2c;
  font-size:13px; padding:9px 12px; border-radius:var(--radius-s); margin-bottom:16px; display:none;
}
.login-foot{
  margin-top:26px; padding-top:20px; border-top:1px solid var(--ink-700);
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.login-foot a{font-size:12.5px; color:var(--ink-200); text-decoration:none;}
.login-foot a:hover{color:var(--brass-bright);}
.conn-badge{
  font-family:var(--font-mono); font-size:11px; padding:3px 10px; border-radius:20px;
  border:1px solid var(--ink-600); color:var(--ink-400); white-space:nowrap;
}
.conn-badge.online{border-color:var(--good); color:var(--good);}
.conn-badge.offline{border-color:var(--bad); color:var(--bad);}
.conn-badge.connecting{border-color:var(--warn); color:var(--warn);}
.conn-badge.local{border-color:var(--ink-600); color:var(--ink-400);}
.login-error b{color:#fff;}
.login-error ul{margin:8px 0 8px 18px; padding:0;}
.login-error ul li{margin-top:4px;}

@media (max-width:820px){
  #loginScreen{flex-direction:column; align-items:flex-start;}
  .login-visual{
    flex:none; width:100%; height:132px; min-height:0;
    display:block; overflow:hidden;
  }
  .login-visual .brand-mark{
    top:16px; left:18px; font-size:15px; gap:7px;
  }
  .login-visual .brand-mark .dot{width:7px; height:7px;}
  .login-visual svg{height:100%; opacity:.9;}
  .login-visual .visual-caption{display:none;}
  .login-pane{
    width:100%; max-width:none; border-left:none; border-top:1px solid var(--ink-700);
    padding:26px 20px 32px; flex:1;
  }
  .login-pane h1{font-size:23px;}
  .login-pane .sub{margin-bottom:24px; font-size:13px;}
  .login-error{font-size:12.5px; padding:10px 12px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field input, .field select{padding:12px 13px; font-size:16px;} /* 16px = no iOS zoom-in on focus */
  .login-foot{margin-top:18px; padding-top:16px; gap:8px;}
  .login-foot + .login-foot{border-top:none; padding-top:8px; margin-top:8px;}
}
@media (max-width:420px){
  .login-visual{height:104px;}
  .login-visual .brand-mark{font-size:13.5px;}
}

/* =====================================================
   APP SHELL
===================================================== */
#app{display:none; min-height:100vh; min-height:100dvh;}
#app.active{display:flex;}

.sidebar{
  width:238px; flex-shrink:0; background:var(--ink-900);
  border-right:1px solid var(--ink-800);
  display:flex; flex-direction:column;
  position:fixed; top:0; bottom:0; left:0; z-index:40;
  padding-top:env(safe-area-inset-top,0px);
  transition:transform .22s ease;
}
.sidebar-brand{
  padding:22px 20px 16px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--ink-800);
}
.sidebar-brand .dot{width:9px; height:9px; border-radius:50%; background:var(--brass-bright); box-shadow:0 0 0 4px rgba(129,104,221,.18); flex-shrink:0;}
.sidebar-brand .txt{font-family:var(--font-display); font-weight:700; font-size:16px; line-height:1.15;}
.sidebar-brand .txt small{display:block; font-family:var(--font-mono); font-weight:400; font-size:10.5px; color:var(--ink-400); letter-spacing:.03em; margin-top:2px;}
.sidebar-nav{flex:1; overflow-y:auto; padding:14px 10px;}
.nav-group{margin-bottom:4px;}
.nav-label{font-family:var(--font-mono); font-size:10px; color:var(--ink-400); letter-spacing:.06em; padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--radius-s);
  color:var(--ink-200); font-size:13.5px; font-weight:500; margin-bottom:2px; position:relative;
}
.nav-item .ic{width:17px; text-align:center; flex-shrink:0; font-size:14px;}
.nav-item:hover{background:var(--ink-850); color:var(--paper);}
.nav-item.active{background:var(--ink-800); color:var(--brass-bright);}
.nav-item.active::before{content:''; position:absolute; left:-10px; top:0; bottom:0; width:3px; background:var(--brass-bright); border-radius:0 3px 3px 0;}
.sidebar-foot{padding:14px 16px; border-bottom:env(safe-area-inset-bottom,0px) solid transparent; border-top:1px solid var(--ink-800);}
.user-chip{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.user-ava{width:34px; height:34px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:14px; flex-shrink:0;}
.user-meta{overflow:hidden;}
.user-meta .nm{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.user-meta .rl{font-size:11px; color:var(--ink-400); font-family:var(--font-mono);}

.sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:39;}
.sidebar-overlay.show{display:block;}

.main-wrap{flex:1; margin-left:238px; display:flex; flex-direction:column; min-width:0;}
.topbar{
  height:60px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; border-bottom:1px solid var(--ink-800); background:var(--ink-950);
  position:sticky; top:0; z-index:30;
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-left{display:flex; align-items:center; gap:14px;}
.burger{display:none; background:none; border:none; color:var(--paper); font-size:20px; padding:4px;}
.page-title{font-family:var(--font-display); font-weight:600; font-size:17px;}
.page-crumb{font-family:var(--font-mono); font-size:11px; color:var(--ink-400);}
.topbar-right{display:flex; align-items:center; gap:14px;}
.role-badge{
  font-family:var(--font-mono); font-size:11px; padding:4px 10px; border-radius:20px;
  border:1px solid var(--ink-600); color:var(--ink-200);
}
.role-badge.role-direksi{border-color:var(--brass); color:var(--brass-bright);}
.role-badge.role-manager{border-color:var(--teal); color:var(--teal-bright);}

.main-content{flex:1; padding:22px; max-width:1400px; width:100%; margin:0 auto;}
@media (max-width:980px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main-wrap{margin-left:0;}
  .burger{display:block;}
}

/* ---------- generic components ---------- */
.card{background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-m); padding:18px;}
.card-title{font-family:var(--font-display); font-weight:600; font-size:14.5px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.card-title .hint{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-400); font-weight:400;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:18px;}
.kpi-card{background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-m); padding:15px 16px; position:relative; overflow:hidden;}
.kpi-card .kv{font-family:var(--font-mono); font-weight:600; font-size:26px; line-height:1;}
.kpi-card .kl{font-size:11.5px; color:var(--ink-200); margin-top:8px;}
.kpi-card .kd{font-size:11px; font-family:var(--font-mono); margin-top:6px;}
.kpi-card .bar{position:absolute; left:0; bottom:0; height:3px; background:var(--brass);}
.kpi-good .kv{color:var(--good);} .kpi-good .bar{background:var(--good);}
.kpi-warn .kv{color:var(--warn);} .kpi-warn .bar{background:var(--warn);}
.kpi-bad .kv{color:var(--bad);} .kpi-bad .bar{background:var(--bad);}
.kpi-brass .kv{color:var(--brass-bright);}

.grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:980px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.chart-box{position:relative; height:260px;}
.chart-box.sm{height:200px;}

.insight-list{display:flex; flex-direction:column; gap:10px;}
.insight-item{
  display:flex; gap:10px; padding:11px 12px; border-radius:var(--radius-s);
  background:var(--ink-850); border-left:3px solid var(--teal);
  font-size:12.8px; line-height:1.5; color:var(--ink-200);
}
.insight-item.warn{border-left-color:var(--warn);}
.insight-item.bad{border-left-color:var(--bad);}
.insight-item.good{border-left-color:var(--good);}
.insight-item b{color:var(--paper);}
.insight-item .ic{font-size:15px; flex-shrink:0;}

.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:16px;}
.toolbar-left{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.search-input{background:var(--ink-850); border:1px solid var(--ink-700); color:var(--paper); padding:8px 12px; border-radius:var(--radius-s); font-size:13px; min-width:180px;}
.select-sm{background:var(--ink-850); border:1px solid var(--ink-700); color:var(--paper); padding:8px 10px; border-radius:var(--radius-s); font-size:12.5px;}

.table-wrap{overflow-x:auto; border:1px solid var(--ink-800); border-radius:var(--radius-m);}
table.data-table{width:100%; border-collapse:collapse; font-size:12.8px; white-space:nowrap;}
table.data-table th{
  background:var(--ink-850); text-align:left; padding:10px 13px; font-family:var(--font-mono);
  font-size:10.8px; letter-spacing:.02em; color:var(--ink-200); border-bottom:1px solid var(--ink-700); position:sticky; top:0;
}
table.data-table td{padding:9px 13px; border-bottom:1px solid var(--ink-800); color:var(--paper);}
table.data-table tbody tr:hover{background:var(--ink-850);}
table.data-table td.num{font-family:var(--font-mono); text-align:right;}
.row-actions{display:flex; gap:6px;}
.icon-btn{background:var(--ink-800); border:1px solid var(--ink-700); color:var(--ink-200); border-radius:var(--radius-s); width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; font-size:13px;}
.icon-btn:hover{border-color:var(--brass); color:var(--brass-bright);}
.icon-btn.del:hover{border-color:var(--bad); color:var(--bad);}
.empty-row td{text-align:center; color:var(--ink-400); padding:34px; font-family:var(--font-mono); font-size:12px;}

.pill{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--ink-600); color:var(--ink-200);}
.pill.good{border-color:var(--good); color:var(--good);}
.pill.warn{border-color:var(--warn); color:var(--warn);}
.pill.bad{border-color:var(--bad); color:var(--bad);}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(36,31,61,.28); backdrop-filter:blur(3px); z-index:60; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:5vh 16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--ink-900); border:1px solid var(--ink-700); border-radius:var(--radius-l); width:520px; max-width:100%; padding:24px; margin:auto;}
.modal-box.wide{width:720px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.modal-head h3{font-family:var(--font-display); font-size:17px; font-weight:600;}
.modal-close{background:none; border:none; color:var(--ink-400); font-size:20px; line-height:1;}
.modal-close:hover{color:var(--paper);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}
.form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--ink-800);}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink-800); border:1px solid var(--ink-600); border-left:3px solid var(--good); padding:11px 16px; border-radius:var(--radius-s); font-size:13px; min-width:220px; box-shadow:0 8px 24px rgba(0,0,0,.35); animation:toastIn .18s ease;}
.toast.err{border-left-color:var(--bad);}
@keyframes toastIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.gauge-wrap{display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;}
.gauge{position:relative; width:150px; height:150px;}
.gauge svg{transform:rotate(-90deg);}
.gauge .gval{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.gauge .gval b{font-family:var(--font-mono); font-size:26px;}
.gauge .gval span{font-size:10px; color:var(--ink-200); font-family:var(--font-mono); margin-top:2px;}
.apq-mini{display:flex; flex-direction:column; gap:10px; min-width:150px;}
.apq-row{display:flex; align-items:center; gap:8px;}
.apq-row .lb{width:64px; font-size:11.5px; color:var(--ink-200); font-family:var(--font-mono);}
.apq-row .track{flex:1; height:7px; background:var(--ink-800); border-radius:6px; overflow:hidden;}
.apq-row .fill{height:100%; border-radius:6px;}
.apq-row .vv{width:44px; text-align:right; font-family:var(--font-mono); font-size:12px;}

.empty-state{text-align:center; padding:60px 20px; color:var(--ink-400);}
.empty-state .ic{font-size:34px; margin-bottom:10px;}
.empty-state p{font-size:13px; font-family:var(--font-mono);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--ink-800); margin-bottom:18px; overflow-x:auto;}
.tab-btn{background:none; border:none; color:var(--ink-200); padding:10px 16px; font-size:13px; font-weight:500; border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--brass-bright); border-color:var(--brass-bright);}

.settings-block{margin-bottom:26px;}

<script>
/* =====================================================
   OEE MMI — CORE (state, db, auth, utils)
===================================================== */
const CACHE_KEY = 'oee_mmi_cache_v2';   // cache lokal (offline fallback)
const DATA_PATH = 'data';               // node data aplikasi di Realtime Database
const USERS_PATH = 'users';             // node profil & role user (key = UID Firebase Auth)

const CFG_KEY = 'oee_mmi_fbconfig_v1';   // konfigurasi yang diisi lewat layar (cadangan firebase-config.js)
let fbApp=null, fbAuth=null, fbDb=null, FB_READY=false, FB_CONFIG=null, FB_DIAG=null;

function readSavedConfig(){
  try{ const raw = localStorage.getItem(CFG_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function isPlaceholder(cfg){
  return !cfg || !cfg.apiKey || String(cfg.apiKey).indexOf('GANTI')===0;
}

/* Mendeteksi penyebab pasti bila koneksi gagal, bukan sekadar "belum terkonfigurasi". */
function diagnose(){
  const d = {sdk:false, cfgFile:false, cfgFilled:false, dbUrl:false, saved:false, protocol:location.protocol, problems:[]};
  d.sdk = (typeof firebase !== 'undefined' && !!firebase.initializeApp);
  d.cfgFile = (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG !== null);
  const saved = readSavedConfig();
  d.saved = !!saved && !isPlaceholder(saved);
  const cfg = d.saved ? saved : (d.cfgFile ? FIREBASE_CONFIG : null);
  d.cfgFilled = !isPlaceholder(cfg);
  d.dbUrl = !!(cfg && cfg.databaseURL && String(cfg.databaseURL).indexOf('GANTI')<0 && /^https:\/\//.test(cfg.databaseURL));
  d.config = cfg;

  if(!d.sdk) d.problems.push('SDK Firebase tidak termuat. Periksa koneksi internet, atau jaringan/pemblokir yang menutup akses ke <code>gstatic.com</code>.');
  if(!d.cfgFile && !d.saved) d.problems.push('Blok konfigurasi Firebase di dalam <code>index.html</code> tidak terbaca (kemungkinan skrip di bagian atas file rusak/terhapus saat diedit).');
  else if(!d.cfgFilled) d.problems.push('Konfigurasi masih berisi teks contoh <code>GANTI_…</code> — belum diisi dengan data proyek Firebase Anda.');
  else if(!d.dbUrl) d.problems.push('Bagian <code>databaseURL</code> kosong atau salah. Salin dari Firebase Console → Realtime Database (bentuknya <code>https://…firebasedatabase.app</code>).');
  if(d.protocol === 'file:') d.problems.push('Halaman dibuka langsung sebagai berkas (<code>file://</code>). Firebase Authentication menolak mode ini — jalankan lewat server, misalnya <code>python -m http.server 8000</code>, lalu buka <code>http://localhost:8000</code>.');
  return d;
}

async function initFirebase(){
  FB_DIAG = diagnose();
  if(!FB_DIAG.sdk || !FB_DIAG.cfgFilled || !FB_DIAG.dbUrl){
    console.warn('Firebase belum siap:', FB_DIAG.problems);
    return false;
  }
  FB_CONFIG = FB_DIAG.config;
  try{
    fbApp = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB_CONFIG);
    fbAuth = firebase.auth();
    // Sesi bertahan selama tab ini terbuka (termasuk saat di-refresh),
    // tapi wajib login ulang bila tab/browser ditutup lalu dibuka lagi.
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    fbDb = firebase.database();
    FB_READY = true;
    return true;
  }catch(e){
    console.error('Gagal inisialisasi Firebase:', e);
    FB_DIAG.problems.push('Firebase menolak konfigurasi: <code>'+escapeHtml(e.message||e.code)+'</code>');
    return false;
  }
}

}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtNum(n,d=1){ if(n===null||n===undefined||isNaN(n)) return '–'; return Number(n).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(n,d=1){ return fmtNum(n*100,d)+'%'; }
function fmtDate(s){ if(!s) return '–'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function seedData(){
  const produk = [
    {id:uid(), kode:'PF-EDT-050', nama:'Eau de Toilette Rose 50ml', volume:50, isiPerDus:24, kapasitasDusPerJam:14, kapasitasPcsPerJam:336},
    {id:uid(), kode:'PF-EDP-100', nama:'Eau de Parfum Oud 100ml', volume:100, isiPerDus:12, kapasitasDusPerJam:9, kapasitasPcsPerJam:108},
    {id:uid(), kode:'PF-BSC-030', nama:'Body Splash Citrus 30ml', volume:30, isiPerDus:36, kapasitasDusPerJam:20, kapasitasPcsPerJam:720},
    {id:uid(), kode:'PF-EDT-075', nama:'Eau de Toilette Musk 75ml', volume:75, isiPerDus:18, kapasitasDusPerJam:11, kapasitasPcsPerJam:198},
  ];
  const mesin = [
    {id:uid(), kode:'FL-01', nama:'Filling Line 1', area:'Filling', kapasitasStandar:340},
    {id:uid(), kode:'FL-02', nama:'Filling Line 2', area:'Filling', kapasitasStandar:220},
    {id:uid(), kode:'CAP-01', nama:'Capping & Labeling 1', area:'Packing', kapasitasStandar:400},
    {id:uid(), kode:'PKG-01', nama:'Cartoning Line 1', area:'Packing', kapasitasStandar:150},
  ];
  const operator = [
    {id:uid(), nik:'MMI-0231', nama:'Rudi Hartono', shift:'Shift 1', area:'Filling'},
    {id:uid(), nik:'MMI-0244', nama:'Siti Amelia', shift:'Shift 2', area:'Filling'},
    {id:uid(), nik:'MMI-0198', nama:'Budi Santoso', shift:'Shift 1', area:'Packing'},
    {id:uid(), nik:'MMI-0267', nama:'Dewi Anggraini', shift:'Shift 3', area:'Packing'},
  ];
  const kapasitas = [
    {id:uid(), produkId:produk[0].id, mesinId:mesin[0].id, kapasitasPcsPerJam:336},
    {id:uid(), produkId:produk[1].id, mesinId:mesin[0].id, kapasitasPcsPerJam:180},
    {id:uid(), produkId:produk[2].id, mesinId:mesin[1].id, kapasitasPcsPerJam:720},
    {id:uid(), produkId:produk[3].id, mesinId:mesin[1].id, kapasitasPcsPerJam:198},
  ];
  const shiftMaster = [
    {id:uid(), kode:'S1', nama:'Shift 1', jamMulai:'07:00', jamSelesai:'15:00', durasiMenit:480},
    {id:uid(), kode:'S2', nama:'Shift 2', jamMulai:'15:00', jamSelesai:'23:00', durasiMenit:480},
    {id:uid(), kode:'S3', nama:'Shift 3', jamMulai:'23:00', jamSelesai:'07:00', durasiMenit:480},
  ];
  const downtimeCategories = ['Setup / Changeover','Breakdown Mesin','Menunggu Material','Kualitas / Rework','Maintenance Terjadwal','Menunggu Operator','Lain-lain'];

  // generate ~30 days of oeeInput + downtime demo history
  const oeeInput = [];
  const downtime = [];
  const mesinIds = mesin.map(m=>m.id);
  const produkIds = produk.map(p=>p.id);
  const opIds = operator.map(o=>o.id);
  for(let d=29; d>=0; d--){
    const dt = new Date(); dt.setDate(dt.getDate()-d);
    const ds = dt.toISOString().slice(0,10);
    const numEntries = 2 + Math.floor(Math.random()*2);
    for(let e=0;e<numEntries;e++){
      const mesinId = mesinIds[Math.floor(Math.random()*mesinIds.length)];
      const produkId = produkIds[Math.floor(Math.random()*produkIds.length)];
      const cap = kapasitas.find(k=>k.mesinId===mesinId && k.produkId===produkId);
      const idealRate = cap ? cap.kapasitasPcsPerJam : (produk.find(p=>p.id===produkId).kapasitasPcsPerJam);
      const planned = 480;
      const dtMenit = Math.round(20 + Math.random()*70);
      const operating = planned - dtMenit;
      const perfFactor = 0.78 + Math.random()*0.19;
      const totalCount = Math.round((idealRate/60)*operating*perfFactor);
      const rejectRate = 0.005 + Math.random()*0.035;
      const rejectCount = Math.round(totalCount*rejectRate);
      oeeInput.push({
        id:uid(), tanggal:ds, shift: shiftMaster[e%3].nama, mesinId, produkId,
        operatorId: opIds[Math.floor(Math.random()*opIds.length)],
        plannedTimeMenit: planned, totalCount, rejectCount, downtimeMenit: dtMenit,
        catatan:''
      });
      if(Math.random()<0.85){
        downtime.push({
          id:uid(), tanggal:ds, shift: shiftMaster[e%3].nama, mesinId,
          mulai:'', selesai:'', durasiMenit: dtMenit,
          kategori: downtimeCategories[Math.floor(Math.random()*downtimeCategories.length)],
          keterangan:''
        });
      }
    }
  }

  const allowedStops = [
    {id:uid(), nama:'Istirahat / Sholat', durasiMenit:60, aktif:true},
    {id:uid(), nama:'Briefing & Cleaning Awal Shift', durasiMenit:15, aktif:true},
  ];

  return {
    users: [],
    produk, mesin, operator, kapasitas, shiftMaster, oeeInput, downtime,
    settings:{
      companyName:'PT MMI — Maklon & Manufaktur Parfum',
      downtimeCategories,
      allowedStops,
      oeeTargets:{ oee:0.85, availability:0.9, performance:0.95, quality:0.99 },
    }
  };
}

let DB = null;
let SESSION = null;
const DATA_COLLS = ['produk','mesin','operator','kapasitas','shiftMaster','oeeInput','downtime','settings'];
let _shadow = {};          // snapshot terakhir tiap koleksi -> dipakai menulis per-bagian saja
let _suppressSync = false; // cegah re-render saat perubahan berasal dari tulisan kita sendiri

function ensureShape(){
  if(!DB) DB = {};
  const seed = seedData();
  DATA_COLLS.forEach(k=>{ if(!DB[k]) DB[k] = seed[k]; });
  if(!DB.users) DB.users = [];
  if(!DB.settings.downtimeCategories) DB.settings.downtimeCategories = seed.settings.downtimeCategories;
  if(!DB.settings.oeeTargets) DB.settings.oeeTargets = seed.settings.oeeTargets;
  if(!DB.settings.allowedStops) DB.settings.allowedStops = seed.settings.allowedStops;
}
function snapshotShadow(){
  _shadow = {};
  DATA_COLLS.forEach(k=>{ _shadow[k] = JSON.stringify(DB[k]); });
}
function cacheLocal(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({data:DB, ts:Date.now()})); }catch(e){}
}

/* Memuat data: dari Firebase bila siap, kalau tidak dari cache lokal. */
async function loadDB(){
  if(FB_READY){
    try{
      const snap = await fbDb.ref(DATA_PATH).get();
      if(snap.exists()){ DB = snap.val(); }
      else{
        DB = seedData();
        await fbDb.ref(DATA_PATH).set(DB);   // inisialisasi pertama kali
      }
      ensureShape(); snapshotShadow(); cacheLocal();
      attachRealtimeSync();
      setConnBadge('online','● Online');
      return;
    }catch(e){
      console.error('Gagal memuat data dari Firebase:', e);
      setConnBadge('offline','● Offline (cache)');
    }
  }
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    DB = raw ? JSON.parse(raw).data : seedData();
  }catch(e){ DB = seedData(); }
  ensureShape(); snapshotShadow();
  if(!FB_READY) setConnBadge('local','● Mode lokal');
}

/* Menyimpan: hanya koleksi yang benar-benar berubah yang ditulis (bukan seluruh tree). */
function saveDB(){
  ensureShape();
  const changed = [];
  DATA_COLLS.forEach(k=>{
    const s = JSON.stringify(DB[k]);
    if(_shadow[k] !== s){ _shadow[k] = s; changed.push(k); }
  });
  cacheLocal();
  if(!FB_READY || !changed.length) return;
  _suppressSync = true;
  const updates = {};
  changed.forEach(k=>{ updates[k] = DB[k]; });
  fbDb.ref(DATA_PATH).update(updates)
    .then(()=>{ setTimeout(()=>{ _suppressSync=false; }, 400); })
    .catch(err=>{
      _suppressSync = false;
      console.error(err);
      toast('Gagal menyimpan ke server: '+(err.message||'akses ditolak'), true);
    });
}

/* Sinkronisasi realtime antar perangkat/pengguna. */
function attachRealtimeSync(){
  fbDb.ref(DATA_PATH).on('value', snap=>{
    if(!snap.exists()) return;
    if(_suppressSync) return;
    const incoming = snap.val();
    if(JSON.stringify(incoming) === JSON.stringify(stripUsers(DB))) return;
    DB = Object.assign({users: DB && DB.users ? DB.users : []}, incoming);
    ensureShape(); snapshotShadow(); cacheLocal();
    if(SESSION && typeof CURRENT_PAGE !== 'undefined' && document.getElementById('mainContent')){
      navigate(CURRENT_PAGE);
      toast('Data diperbarui dari server.');
    }
  }, err=>{ console.error(err); setConnBadge('offline','● Offline'); });
}
function stripUsers(db){
  if(!db) return {};
  const c = Object.assign({}, db); delete c.users; return c;
}

/* Profil pengguna (role) disimpan terpisah di /users/{uid}. */
async function loadUsers(){
  if(!FB_READY){ return; }
  try{
    const snap = await fbDb.ref(USERS_PATH).get();
    const val = snap.exists() ? snap.val() : {};
    DB.users = Object.keys(val).map(k=>Object.assign({id:k, uid:k}, val[k]));
  }catch(e){ console.warn('Tidak dapat membaca daftar pengguna:', e.message); }
}
async function saveUserProfile(uid2, profile){
  if(!FB_READY) return;
  await fbDb.ref(USERS_PATH+'/'+uid2).set(profile);
}
async function deleteUserProfile(uid2){
  if(!FB_READY) return;
  await fbDb.ref(USERS_PATH+'/'+uid2).remove();
}

const ROLE_COLOR = {staff:'', supervisor:'', manager:'role-manager', direksi:'role-direksi'};

/* =====================================================
   OEE CALCULATION ENGINE
===================================================== */
function getIdealRate(produkId, mesinId){
  const k = DB.kapasitas.find(x=>x.produkId===produkId && x.mesinId===mesinId);
  if(k) return k.kapasitasPcsPerJam;
  const p = DB.produk.find(x=>x.id===produkId);
  return p ? p.kapasitasPcsPerJam : 0;
}
/* Menghitung durasi shift (menit) otomatis dari Jam Mulai & Jam Selesai.
   Menangani shift yang melewati tengah malam (mis. 23:00 - 07:00). */
function calcShiftDurationMinutes(jamMulai, jamSelesai){
  if(!jamMulai || !jamSelesai) return 0;
  const [h1,m1] = jamMulai.split(':').map(Number);
  const [h2,m2] = jamSelesai.split(':').map(Number);
  if([h1,m1,h2,m2].some(isNaN)) return 0;
  let start = h1*60+m1, end = h2*60+m2;
  if(end <= start) end += 24*60; // lewat tengah malam
  return end-start;
}
/* Menghitung kecepatan pengerjaan barang WIP (pcs/jam) dari hasil WIP & waktu pengerjaannya. */
function calcWipRate(row){
  if(!row || !row.wipMenit || row.wipMenit<=0 || !row.wipCount) return null;
  return row.wipCount/(row.wipMenit/60);
}
/* Total menit "stop yang diizinkan" per shift — berlaku untuk SEMUA mesin & produk
   (mis. istirahat/sholat, briefing awal shift). Ini BUKAN downtime: mengurangi
   Planned Time sebelum OEE dihitung, sehingga tidak menghukum Availability. */
function totalAllowedStopMinutes(){
  const list = (DB.settings && DB.settings.allowedStops) || [];
  return list.reduce((s,x)=> s + (x.aktif!==false ? (x.durasiMenit||0) : 0), 0);
}
function calcOeeRow(row){
  const rawPlanned = row.plannedTimeMenit || 0;
  const allowedStop = totalAllowedStopMinutes();
  const planned = Math.max(rawPlanned - allowedStop, 0); // Net Planned Production Time
  const downtimeMenit = row.downtimeMenit || 0;
  const operating = Math.max(planned - downtimeMenit, 0);
  const idealRate = getIdealRate(row.produkId, row.mesinId); // pcs/hour
  const availability = planned>0 ? clamp(operating/planned,0,1) : 0;
  let performance = 0;
  if(operating>0 && idealRate>0){
    const idealCycleMin = 1/idealRate; // hours per pcs -> convert below
    // ideal time needed (in minutes) to produce totalCount at idealRate
    const idealMinutesNeeded = (row.totalCount||0) / idealRate * 60;
    performance = clamp(idealMinutesNeeded/operating,0,1.5>1?1:1); // cap at 100%
    performance = clamp(idealMinutesNeeded/operating,0,1);
  }
  const totalCount = row.totalCount||0;
  const rejectCount = row.rejectCount||0;
  const goodCount = Math.max(totalCount-rejectCount,0);
  const quality = totalCount>0 ? clamp(goodCount/totalCount,0,1) : 0;
  const oee = availability*performance*quality;
  return {availability, performance, quality, oee, operating, goodCount, idealRate, netPlanned:planned, allowedStop};
}
function aggregateOee(rows){
  if(!rows.length) return {availability:0,performance:0,quality:0,oee:0,totalCount:0,rejectCount:0,downtimeMenit:0,plannedTimeMenit:0,n:0};
  let sA=0,sP=0,sQ=0,sO=0,totalCount=0,rejectCount=0,downtimeMenit=0,plannedTimeMenit=0;
  rows.forEach(r=>{
    const c = calcOeeRow(r);
    sA+=c.availability; sP+=c.performance; sQ+=c.quality; sO+=c.oee;
    totalCount+=r.totalCount||0; rejectCount+=r.rejectCount||0;
    downtimeMenit+=r.downtimeMenit||0; plannedTimeMenit+=r.plannedTimeMenit||0;
  });
  const n = rows.length;
  return {availability:sA/n, performance:sP/n, quality:sQ/n, oee:sO/n, totalCount, rejectCount, downtimeMenit, plannedTimeMenit, n};
}
function inDateRange(dateStr, from, to){
  if(from && dateStr<from) return false;
  if(to && dateStr>to) return false;
  return true;
}
function filterOee({from,to,mesinId,produkId}={}){
  return DB.oeeInput.filter(r=>{
    if(from||to){ if(!inDateRange(r.tanggal, from, to)) return false; }
    if(mesinId && r.mesinId!==mesinId) return false;
    if(produkId && r.produkId!==produkId) return false;
    return true;
  });
}
function filterDowntime({from,to,mesinId}={}){
  return DB.downtime.filter(r=>{
    if(from||to){ if(!inDateRange(r.tanggal, from, to)) return false; }
    if(mesinId && r.mesinId!==mesinId) return false;
    return true;
  });
}
function nameOf(coll, id, field='nama'){
  const item = DB[coll].find(x=>x.id===id);
  return item ? item[field] : '–';
}
function mesinName(id){ const m=DB.mesin.find(x=>x.id===id); return m? m.nama : '–'; }
function produkName(id){ const p=DB.produk.find(x=>x.id===id); return p? p.nama : '–'; }
function operatorName(id){ const o=DB.operator.find(x=>x.id===id); return o? o.nama : '–'; }

function last30DaysRange(){
  const to = todayStr();
  const d = new Date(); d.setDate(d.getDate()-29);
  const from = d.toISOString().slice(0,10);
  return {from,to};
}

/* group rows by day/week/month for trend charts */
function groupByPeriod(rows, mode){ // mode: 'day'|'week'|'month'
  const map = {};
  rows.forEach(r=>{
    let key;
    const d = new Date(r.tanggal+'T00:00:00');
    if(mode==='day') key = r.tanggal;
    else if(mode==='month') key = r.tanggal.slice(0,7);
    else { // week: ISO week label
      const onejan = new Date(d.getFullYear(),0,1);
      const week = Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
      key = d.getFullYear()+'-W'+String(week).padStart(2,'0');
    }
    if(!map[key]) map[key]=[];
    map[key].push(r);
  });
  const keys = Object.keys(map).sort();
  return keys.map(k=>({label:k, agg:aggregateOee(map[k])}));
}

/* =====================================================
   AI INSIGHT (rule-based, generated from local data — no external API)
   Analisis berlapis: ringkasan makro -> pembedahan Six Big Losses ->
   akar masalah per mesin/produk/shift -> tren & stabilitas -> rekomendasi.
===================================================== */
function diagnoseWeakComponent(agg, targets){
  // Kembalikan komponen (Availability/Performance/Quality) dengan defisit RELATIF terbesar terhadap target.
  const comp = [
    {k:'Availability', v:agg.availability, t:targets.availability},
    {k:'Performance', v:agg.performance, t:targets.performance},
    {k:'Quality', v:agg.quality, t:targets.quality},
  ];
  comp.forEach(c=> c.gap = c.t>0 ? (c.t-c.v)/c.t : 0);
  comp.sort((a,b)=>b.gap-a.gap);
  return comp[0];
}
function sixBigLossesBreakdown(rows){
  // Mengubah defisit Availability/Performance/Quality menjadi satuan MENIT yang sepadan,
  // supaya kerugian dari tiga komponen dapat langsung dibandingkan besarannya.
  let availLossMin=0, perfLossMin=0, qualLossMin=0, basisMin=0;
  rows.forEach(r=>{
    const c = calcOeeRow(r);
    basisMin += c.netPlanned;
    availLossMin += (r.downtimeMenit||0);
    if(c.idealRate>0){
      const idealMinutesForOutput = (r.totalCount||0)/c.idealRate*60;
      perfLossMin += Math.max(c.operating - idealMinutesForOutput, 0);
      qualLossMin += (r.rejectCount||0)/c.idealRate*60;
    }
  });
  const total = availLossMin+perfLossMin+qualLossMin;
  return {availLossMin, perfLossMin, qualLossMin, total, basisMin};
}
function groupAgg(rows, keyFn){
  const map = {};
  rows.forEach(r=>{ const k=keyFn(r); (map[k]=map[k]||[]).push(r); });
  return Object.keys(map).map(k=>({key:k, rows:map[k], agg:aggregateOee(map[k])}));
}
function stdDev(arr){
  if(arr.length<2) return 0;
  const mean = arr.reduce((a,b)=>a+b,0)/arr.length;
  const variance = arr.reduce((a,b)=>a+(b-mean)*(b-mean),0)/arr.length;
  return Math.sqrt(variance);
}

function generateInsights({from,to}){
  const rows = filterOee({from,to});
  const insights = [];
  if(rows.length===0){
    insights.push({type:'warn', ic:'⚠️', html:'Belum ada data input OEE pada periode ini. Insight akan muncul setelah data shift diisi.'});
    return insights;
  }
  const agg = aggregateOee(rows);
  const targets = DB.settings.oeeTargets || {oee:0.85,availability:0.9,performance:0.95,quality:0.99};

  /* 1 — Ringkasan makro vs target */
  if(agg.oee < targets.oee){
    insights.push({type:'bad', ic:'📉', html:`OEE rata-rata periode ini <b>${pct(agg.oee)}</b>, di bawah target <b>${pct(targets.oee)}</b> — selisih ${pct(targets.oee-agg.oee)} dari ${fmtNum(rows.length,0)} entri shift.`});
  } else {
    insights.push({type:'good', ic:'✅', html:`OEE rata-rata periode ini <b>${pct(agg.oee)}</b>, sudah mencapai atau melampaui target <b>${pct(targets.oee)}</b> dari ${fmtNum(rows.length,0)} entri shift.`});
  }

  /* 2 — Pembedahan Six Big Losses: kuantifikasi kerugian dalam menit */
  const sbl = sixBigLossesBreakdown(rows);
  if(sbl.total > 0){
    const parts = [
      {k:'Availability Loss (downtime)', v:sbl.availLossMin, ic:'⛔'},
      {k:'Performance Loss (kecepatan di bawah standar)', v:sbl.perfLossMin, ic:'🐢'},
      {k:'Quality Loss (reject, disetarakan waktu)', v:sbl.qualLossMin, ic:'🚫'},
    ].sort((a,b)=>b.v-a.v);
    const biggest = parts[0];
    insights.push({type:'bad', ic:'🔎', html:
      `<b>Pembedahan kerugian (Six Big Losses)</b> dari total ${fmtNum(sbl.basisMin,0)} menit waktu produksi bersih: `
      + parts.map(p=>`${escapeHtml(p.k)} <b>${fmtNum(p.v,0)} mnt</b> (${pct(sbl.total>0?p.v/sbl.total:0,0)})`).join(' · ')
      + `. Kontributor terbesar adalah <b>${escapeHtml(biggest.k)}</b> — inilah titik ungkit tertinggi untuk menaikkan OEE.`});
  }

  /* 3 — Per mesin: peringkat + diagnosis akar masalah pada mesin terlemah */
  const mesinAgg = groupAgg(rows, r=>r.mesinId).sort((a,b)=>a.agg.oee-b.agg.oee);
  if(mesinAgg.length>1){
    const worst = mesinAgg[0], best = mesinAgg[mesinAgg.length-1];
    const worstWeak = diagnoseWeakComponent(worst.agg, targets);
    insights.push({type:'warn', ic:'🏭', html:`Mesin dengan OEE terendah: <b>${escapeHtml(mesinName(worst.key))}</b> (${pct(worst.agg.oee)}) — akar masalah utamanya di komponen <b>${worstWeak.k}</b> (${pct(worstWeak.v)} vs target ${pct(worstWeak.t)}). Mesin tertinggi: <b>${escapeHtml(mesinName(best.key))}</b> (${pct(best.agg.oee)}), selisih ${pct(best.agg.oee-worst.agg.oee)}.`});
  } else if(mesinAgg.length===1){
    const w = diagnoseWeakComponent(mesinAgg[0].agg, targets);
    if(w.gap>0.02) insights.push({type:'warn', ic:'🏭', html:`Pada mesin ${escapeHtml(mesinName(mesinAgg[0].key))}, komponen paling tertinggal adalah <b>${w.k}</b> (${pct(w.v)} vs target ${pct(w.t)}).`});
  }

  /* 4 — Per produk: produk mana yang menyeret OEE turun */
  const produkAgg = groupAgg(rows, r=>r.produkId).sort((a,b)=>a.agg.oee-b.agg.oee);
  if(produkAgg.length>1){
    const worstP = produkAgg[0];
    const worstPWeak = diagnoseWeakComponent(worstP.agg, targets);
    insights.push({type:'warn', ic:'🧴', html:`Produk dengan OEE terendah: <b>${escapeHtml(produkName(worstP.key))}</b> (${pct(worstP.agg.oee)}), terutama karena ${worstPWeak.k} (${pct(worstPWeak.v)}). Perlu dicek apakah kapasitas standar produk ini di data master sudah realistis.`});
  }

  /* 5 — Per shift: pola waktu (mis. shift malam lebih lemah) */
  const shiftAgg = groupAgg(rows, r=>r.shift).sort((a,b)=>a.agg.oee-b.agg.oee);
  if(shiftAgg.length>1){
    const worstS = shiftAgg[0], bestS = shiftAgg[shiftAgg.length-1];
    if(bestS.agg.oee - worstS.agg.oee > 0.03){
      insights.push({type:'warn', ic:'🌓', html:`<b>${escapeHtml(worstS.key)}</b> memiliki OEE rata-rata terendah antar shift (${pct(worstS.agg.oee)}, dari ${fmtNum(worstS.rows.length,0)} entri) dibanding <b>${escapeHtml(bestS.key)}</b> (${pct(bestS.agg.oee)}). Pola ini layak ditelusuri — bisa terkait kesiapan mesin, ketersediaan operator, atau serah-terima antar shift.`});
    }
  }

  /* 6 — Downtime: Pareto + tren dalam periode */
  const dt = filterDowntime({from,to});
  if(dt.length){
    const byCat = {};
    dt.forEach(d=>{ byCat[d.kategori] = (byCat[d.kategori]||0) + (d.durasiMenit||0); });
    const sorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const totalDt = sorted.reduce((s,x)=>s+x[1],0);
    if(sorted.length){
      const top2 = sorted.slice(0,2);
      const top2Sum = top2.reduce((s,x)=>s+x[1],0);
      const namesTop2 = top2.map(x=>escapeHtml(x[0])).join(' & ');
      insights.push({type:'bad', ic:'⏱️', html:`Downtime didominasi ${sorted.length>1?`2 kategori teratas — <b>${namesTop2}</b>`:`kategori <b>${escapeHtml(sorted[0][0])}</b>`}, menyumbang ${fmtNum(top2Sum,0)} menit (${pct(totalDt>0?top2Sum/totalDt:0,0)} dari total ${fmtNum(totalDt,0)} menit downtime tercatat)${sorted.length>1?' — sesuai prinsip Pareto, menuntaskan dua kategori ini memberi dampak terbesar':''}.`});
    }
    // tren: paruh pertama vs kedua periode
    const datesSorted = [...new Set(dt.map(d=>d.tanggal))].sort();
    if(datesSorted.length>=4){
      const mid = datesSorted[Math.floor(datesSorted.length/2)];
      const firstHalf = dt.filter(d=>d.tanggal<mid).reduce((s,d)=>s+(d.durasiMenit||0),0);
      const secondHalf = dt.filter(d=>d.tanggal>=mid).reduce((s,d)=>s+(d.durasiMenit||0),0);
      if(firstHalf>0 && Math.abs(secondHalf-firstHalf)/firstHalf > 0.15){
        const naik = secondHalf>firstHalf;
        insights.push({type: naik?'bad':'good', ic: naik?'📈':'📉', html:`Total downtime pada paruh kedua periode ${naik?'meningkat':'menurun'} ${pct(Math.abs(secondHalf-firstHalf)/firstHalf,0)} dibanding paruh pertama (${fmtNum(firstHalf,0)} → ${fmtNum(secondHalf,0)} menit).`});
      }
    }
  }

  /* 7 — Reject rate + produk penyumbang reject terbesar */
  const rejectRate = agg.totalCount>0 ? agg.rejectCount/agg.totalCount : 0;
  if(rejectRate > 0.02){
    let worstRejectProduk = null;
    if(produkAgg.length>1){
      worstRejectProduk = produkAgg.map(p=>({key:p.key, rate: p.agg.totalCount>0? p.agg.rejectCount/p.agg.totalCount : 0}))
        .sort((a,b)=>b.rate-a.rate)[0];
    }
    insights.push({type:'bad', ic:'🚫', html:`Reject rate periode ini <b>${pct(rejectRate,2)}</b> (${fmtNum(agg.rejectCount,0)} dari ${fmtNum(agg.totalCount,0)} pcs), tergolong tinggi.`
      + (worstRejectProduk && worstRejectProduk.rate>rejectRate ? ` Penyumbang terbesar: <b>${escapeHtml(produkName(worstRejectProduk.key))}</b> dengan reject rate ${pct(worstRejectProduk.rate,2)}.` : '')});
  } else {
    insights.push({type:'good', ic:'👍', html:`Reject rate periode ini terjaga di <b>${pct(rejectRate,2)}</b>, di bawah ambang 2%.`});
  }

  /* 8 — Stabilitas proses: variasi OEE harian */
  const dayGroups = groupByPeriod(rows,'day');
  if(dayGroups.length>=5){
    const oeeSeries = dayGroups.map(d=>d.agg.oee);
    const meanOee = oeeSeries.reduce((a,b)=>a+b,0)/oeeSeries.length;
    const sd = stdDev(oeeSeries);
    const cv = meanOee>0 ? sd/meanOee : 0;
    if(cv > 0.15){
      insights.push({type:'warn', ic:'📊', html:`OEE harian cukup fluktuatif (variasi ±${pct(cv,0)} dari rata-rata ${pct(meanOee)}), menandakan proses belum stabil hari ke hari — perlu distandardisasi (SOP, changeover, ketersediaan material).`});
    } else {
      insights.push({type:'good', ic:'📊', html:`OEE harian relatif stabil (variasi ±${pct(cv,0)} dari rata-rata ${pct(meanOee)}).`});
    }
  }

  /* 9 — Tren vs periode sebelumnya (rentang sama panjang) */
  const fromD = new Date(from+'T00:00:00'), toD = new Date(to+'T00:00:00');
  const spanDays = Math.round((toD-fromD)/86400000)+1;
  const prevTo = new Date(fromD); prevTo.setDate(prevTo.getDate()-1);
  const prevFrom = new Date(prevTo); prevFrom.setDate(prevFrom.getDate()-(spanDays-1));
  const prevRows = filterOee({from:prevFrom.toISOString().slice(0,10), to:prevTo.toISOString().slice(0,10)});
  if(prevRows.length){
    const prevAgg = aggregateOee(prevRows);
    const delta = agg.oee - prevAgg.oee;
    if(Math.abs(delta) >= 0.01){
      insights.push({type: delta>0?'good':'bad', ic: delta>0?'📈':'📉', html:`OEE ${delta>0?'naik':'turun'} <b>${pct(Math.abs(delta))}</b> dibanding periode sebelumnya yang setara panjangnya (${pct(prevAgg.oee)} → ${pct(agg.oee)}).`});
    }
  }

  /* 10 — Rekomendasi konkret berdasarkan temuan terbesar */
  if(sbl.total > 0){
    const parts2 = [
      {k:'downtime/breakdown', v:sbl.availLossMin, action:'menelusuri kategori downtime terbesar dan menjadwalkan preventive maintenance'},
      {k:'kecepatan produksi (performance)', v:sbl.perfLossMin, action:'meninjau kapasitas standar di data master dan mengecek penyebab kecepatan aktual di bawah standar'},
      {k:'kualitas/reject', v:sbl.qualLossMin, action:'melakukan root-cause reject dan memperketat titik kontrol kualitas'},
    ].sort((a,b)=>b.v-a.v);
    const rec = parts2[0];
    insights.push({type:'warn', ic:'💡', html:`<b>Rekomendasi:</b> karena kerugian terbesar berasal dari ${escapeHtml(rec.k)}, prioritaskan tindakan dengan ${escapeHtml(rec.action)}. Ini berpotensi memberi kenaikan OEE tercepat dibanding memperbaiki komponen lain terlebih dulu.`});
  }

  return insights;
}

function toast(msg, isErr=false){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}

function buildNav(){
  const nav = document.getElementById('sidebarNav');
  let html = '';
  NAV.forEach(group=>{
    const visibleItems = group.items.filter(it=>can(it.key,'view'));
    if(!visibleItems.length) return;
    html += `<div class="nav-group"><div class="nav-label">${group.group}</div>`;
    visibleItems.forEach(it=>{
      html += `<a href="#" class="nav-item" data-page="${it.key}"><span class="ic">${it.ic}</span>${it.label}</a>`;
    });
    html += `</div>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = (e)=>{ e.preventDefault(); navigate(el.dataset.page); };
  });
}

const PAGE_RENDERERS = {}; // filled below by each module

function navigate(page){
  if(!can(page,'view')){ page='dashboard'; }
  CURRENT_PAGE = page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page]||page;
  document.getElementById('pageCrumb').textContent = 'OEE MMI / '+(PAGE_TITLES[page]||page);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  const mount = document.getElementById('mainContent');
  mount.innerHTML = '<div class="empty-state"><div class="ic">⏳</div><p>MEMUAT...</p></div>';
  const fn = PAGE_RENDERERS[page];
  if(fn) fn(mount); else mount.innerHTML = '<div class="empty-state"><p>Halaman tidak ditemukan.</p></div>';
}

/* =====================================================
   GENERIC CRUD PAGE FACTORY
   config = {
     key, title, icon, columns:[{field,label,type,render?,width?}],
     formFields:[{field,label,type,options?,required?,step?}],
     searchFields:[...fields to search string on],
     defaultSort
   }
===================================================== */
function makeCrudPage(config){
  return function(mount){
    const canEdit = can(config.key,'edit');
    let searchTerm = '';
    function getRows(){
      let rows = DB[config.key].slice();
      if(config.sort) rows = config.sort(rows);
      if(searchTerm){
        const s = searchTerm.toLowerCase();
        rows = rows.filter(r=> config.searchFields.some(f=> String(r[f]||'').toLowerCase().includes(s)));
      }
      return rows;
    }
    function renderTable(){
      const rows = getRows();
      const tbody = rows.length ? rows.map(r=>rowHtml(r)).join('') : `<tr class="empty-row"><td colspan="${config.columns.length+1}">Belum ada data. ${canEdit?'Klik "Tambah Data" untuk mulai.':''}</td></tr>`;
      document.getElementById('crudTableBody').innerHTML = tbody;
      document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));
      document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteRow(b.dataset.del));
    }
    function rowHtml(r){
      const cells = config.columns.map(c=>{
        const val = c.render ? c.render(r) : escapeHtml(r[c.field]??'–');
        return `<td class="${c.num?'num':''}">${val}</td>`;
      }).join('');
      const actions = canEdit ? `<td><div class="row-actions">
          <button class="icon-btn" data-edit="${r.id}" title="Edit">✎</button>
          <button class="icon-btn del" data-del="${r.id}" title="Hapus">🗑</button>
        </div></td>` : '<td></td>';
      return `<tr>${cells}${actions}</tr>`;
    }
    function deleteRow(id){
      if(!confirm('Hapus data ini? Tindakan tidak dapat dibatalkan.')) return;
      DB[config.key] = DB[config.key].filter(x=>x.id!==id);
      saveDB(); renderTable(); toast('Data dihapus.');
    }
    function openForm(id){
      const editing = !!id;
      const row = editing ? DB[config.key].find(x=>x.id===id) : {};
      const fieldsHtml = config.formFields.map(f=>{
        const val = row[f.field] ?? '';
        if(f.type==='select'){
          const opts = (typeof f.options==='function' ? f.options() : f.options).map(o=>
            `<option value="${escapeHtml(o.value)}" ${String(val)===String(o.value)?'selected':''}>${escapeHtml(o.label)}</option>`).join('');
          return `<div class="field ${f.full?'full':''}"><label>${f.label}${f.required?' *':''}</label><select name="${f.field}" ${f.required?'required':''}>${f.type==='select'&&!f.required?'<option value="">–</option>':''}${opts}</select></div>`;
        }
        return `<div class="field ${f.full?'full':''}"><label>${f.label}${f.required?' *':''}</label><input type="${f.type||'text'}" name="${f.field}" value="${escapeHtml(val)}" ${f.step?`step="${f.step}"`:''} ${f.required?'required':''} placeholder="${f.placeholder||''}"></div>`;
      }).join('');
      openModal((editing?'Edit ':'Tambah ')+config.title, `
        <form id="crudForm">
          <div class="form-grid">${fieldsHtml}</div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="cancelFormBtn">Batal</button>
            <button type="submit" class="btn btn-primary">${editing?'Simpan Perubahan':'Tambah Data'}</button>
          </div>
        </form>`, {wide:config.wideForm});
      document.getElementById('cancelFormBtn').onclick = closeModal;
      document.getElementById('crudForm').onsubmit = (e)=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const obj = editing ? row : {id:uid()};
        config.formFields.forEach(f=>{
          let v = fd.get(f.field);
          if(f.type==='number') v = v===''? 0 : parseFloat(v);
          obj[f.field] = v;
        });
        if(config.beforeSave) config.beforeSave(obj);
        if(!editing) DB[config.key].push(obj);
        saveDB(); closeModal(); renderTable(); toast(editing?'Perubahan disimpan.':'Data ditambahkan.');
      };
    }
    mount.innerHTML = `
      <div class="toolbar">
        <div class="toolbar-left">
          <input type="text" class="search-input" id="crudSearch" placeholder="Cari ${config.title.toLowerCase()}...">
          <span class="pill">${getRows().length} data</span>
        </div>
        ${canEdit?`<button class="btn btn-primary btn-sm" id="addRowBtn">+ Tambah Data</button>`:''}
      </div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr>${config.columns.map(c=>`<th>${c.label}</th>`).join('')}<th>Aksi</th></tr></thead>
        <tbody id="crudTableBody"></tbody>
      </table></div>
    `;
    renderTable();
    document.getElementById('crudSearch').oninput = (e)=>{ searchTerm=e.target.value; renderTable();
      document.querySelector('.pill').textContent = getRows().length+' data'; };
    if(canEdit) document.getElementById('addRowBtn').onclick = ()=>openForm(null);
  };
}

          <div class="field"><label>Mesin *</label><select name="mesinId" required>${DB.mesin.map(m=>`<option value="${m.id}" ${row.mesinId===m.id?'selected':''}>${escapeHtml(m.kode)} — ${escapeHtml(m.nama)}</option>`).join('')}</select></div>
          <div class="field"><label>Produk *</label><select name="produkId" required>${DB.produk.map(p=>`<option value="${p.id}" ${row.produkId===p.id?'selected':''}>${escapeHtml(p.kode)} — ${escapeHtml(p.nama)}</option>`).join('')}</select></div>
          <div class="field"><label>Operator</label><select name="operatorId">${DB.operator.map(o=>`<option value="${o.id}" ${row.operatorId===o.id?'selected':''}>${escapeHtml(o.nama)}</option>`).join('')}</select></div>
          <div class="field">
            <label>Planned Time (menit) *</label>
            <input type="number" name="plannedTimeMenit" id="oeePlannedInput" value="${row.plannedTimeMenit??480}" required>

          <div class="field full" style="margin-top:-8px;">
            <span style="font-size:11px;color:var(--ink-400);">↑ Otomatis terisi dari jam kerja shift yang dipilih (tab "Waktu Kerja") — masih bisa diubah manual bila shift tidak penuh/lembur.</span>

          <div class="field"><label>Reject (pcs) *</label><input type="number" name="rejectCount" value="${row.rejectCount??0}" required></div>
          <div class="field"><label>Hasil Produk WIP (pcs)</label><input type="number" name="wipCount" id="oeeWipCount" value="${row.wipCount??0}"></div>
          <div class="field"><label>Waktu Pengerjaan WIP (menit)</label><input type="number" name="wipMenit" id="oeeWipMenit" value="${row.wipMenit??0}"></div>
          <div class="field full" style="background:var(--ink-850);border-radius:6px;padding:9px 12px;margin-top:-4px;">
            <span style="font-size:12px;color:var(--ink-200);">🧮 Kecepatan pengerjaan WIP: <b id="wipRateDisplay">${(()=>{const wr=calcWipRate(row); return wr!==null?fmtNum(wr,1)+' pcs/jam':'–';})()}</b> (dihitung otomatis dari Hasil WIP ÷ Waktu Pengerjaan WIP)</span>
          </div>
          <div class="field full" style="background:var(--ink-850);border-radius:6px;padding:9px 12px;">
            <span style="font-size:12px;color:var(--ink-200);">ℹ️ ${fmtNum(totalAllowedStopMinutes(),0)} menit/shift waktu stop yang diizinkan (tab "Waktu Stop Diizinkan") otomatis dikurangi dari Planned Time — <b>bukan</b> downtime, tidak perlu dimasukkan ke kolom Total Downtime.</span>
          </div>
          <div class="field full"><label>Catatan</label><input type="text" name="catatan" value="${escapeHtml(row.catatan||'')}"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelOeeBtn">Batal</button>
          <button type="submit" class="btn btn-primary">${editing?'Simpan Perubahan':'Tambah Data'}</button>
        </div>
      </form>
    `, {wide:true});
    document.getElementById('cancelOeeBtn').onclick = closeModal;
    // Planned Time otomatis mengikuti durasi shift terpilih
    document.getElementById('oeeShiftSelect').onchange = (e)=>{
      const opt = e.target.selectedOptions[0];
      const durasi = opt ? parseFloat(opt.dataset.durasi)||0 : 0;

    };

      const wc = parseFloat(document.getElementById('oeeWipCount').value)||0;
      const wm = parseFloat(document.getElementById('oeeWipMenit').value)||0;

    document.getElementById('oeeWipMenit').oninput = updateWipRate;

      saveDB(); closeModal(); renderTable(); toast(editing?'Perubahan disimpan.':'Data OEE ditambahkan.');
    };
  }

  /* ---------- TAB: Waktu Kerja (shift master, dipindah dari Pengaturan) ---------- */
  function drawWaktuKerja(mount){
    mount.innerHTML += `
      <div class="card">
        <div class="card-title">Waktu Kerja / Shift <span class="hint">Durasi (menit) dihitung otomatis dari Jam Mulai &amp; Jam Selesai</span></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Kode</th><th>Nama Shift</th><th>Jam Mulai</th><th>Jam Selesai</th><th>Durasi (mnt)</th><th>Aksi</th></tr></thead>
          <tbody id="shiftTableBody"></tbody>
        </table></div>
        ${canEditSettings?`<button class="btn btn-ghost btn-sm" id="addShiftBtn" style="margin-top:12px;">+ Tambah Shift</button>`:''}
        ${!canEditSettings?`<p style="font-size:12px;color:var(--ink-400);margin-top:10px;">Hanya Manager yang dapat mengubah data Waktu Kerja.</p>`:''}
      </div>
    `;
    renderShiftTable();
    if(canEditSettings) document.getElementById('addShiftBtn').onclick = ()=>openShiftForm(null);
  }
  function renderShiftTable(){
    document.getElementById('shiftTableBody').innerHTML = DB.shiftMaster.map(s=>`
      <tr><td>${escapeHtml(s.kode)}</td><td>${escapeHtml(s.nama)}</td><td>${escapeHtml(s.jamMulai)}</td><td>${escapeHtml(s.jamSelesai)}</td><td class="num">${fmtNum(s.durasiMenit,0)}</td>
      <td><div class="row-actions">${canEditSettings?`<button class="icon-btn" data-es="${s.id}">✎</button><button class="icon-btn del" data-ds="${s.id}">🗑</button>`:''}</div></td></tr>
    `).join('') || `<tr class="empty-row"><td colspan="6">Belum ada shift.</td></tr>`;
    document.querySelectorAll('[data-es]').forEach(b=>b.onclick=()=>openShiftForm(b.dataset.es));
    document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{
      if(!confirm('Hapus shift ini?')) return;
      DB.shiftMaster = DB.shiftMaster.filter(x=>x.id!==b.dataset.ds); saveDB(); renderShiftTable();
    });
  }
  function openShiftForm(id){
    const editing=!!id; const row = editing? DB.shiftMaster.find(x=>x.id===id) : {};
    const durasiAwal = calcShiftDurationMinutes(row.jamMulai, row.jamSelesai);
    openModal((editing?'Edit ':'Tambah ')+'Shift', `
      <form id="shiftForm">
        <div class="form-grid">
          <div class="field"><label>Kode *</label><input name="kode" value="${escapeHtml(row.kode||'')}" required></div>
          <div class="field"><label>Nama Shift *</label><input name="nama" value="${escapeHtml(row.nama||'')}" required></div>
          <div class="field"><label>Jam Mulai *</label><input type="time" name="jamMulai" id="shiftJamMulai" value="${row.jamMulai||''}" required></div>
          <div class="field"><label>Jam Selesai *</label><input type="time" name="jamSelesai" id="shiftJamSelesai" value="${row.jamSelesai||''}" required></div>
          <div class="field full" style="background:var(--ink-850);border-radius:6px;padding:9px 12px;">
            <span style="font-size:12.5px;color:var(--ink-200);">🧮 Durasi otomatis: <b id="shiftDurasiDisplay">${fmtNum(durasiAwal,0)}</b> menit</span>
          </div>
        </div>
        <div class="form-actions"><button type="button" class="btn btn-ghost" id="cancelShiftBtn">Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div>
      </form>`);
    document.getElementById('cancelShiftBtn').onclick = closeModal;
    function updateDurasi(){
      const jm = document.getElementById('shiftJamMulai').value;
      const js = document.getElementById('shiftJamSelesai').value;
      document.getElementById('shiftDurasiDisplay').textContent = fmtNum(calcShiftDurationMinutes(jm,js),0);
    }
    document.getElementById('shiftJamMulai').onchange = updateDurasi;
    document.getElementById('shiftJamSelesai').onchange = updateDurasi;
    document.getElementById('shiftForm').onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const obj = editing? row : {id:uid()};
      ['kode','nama','jamMulai','jamSelesai'].forEach(f=>obj[f]=fd.get(f));
      obj.durasiMenit = calcShiftDurationMinutes(obj.jamMulai, obj.jamSelesai); // selalu dihitung ulang, tidak diinput manual
      if(!editing) DB.shiftMaster.push(obj);
      saveDB(); closeModal(); renderShiftTable(); toast('Shift disimpan. Durasi: '+fmtNum(obj.durasiMenit,0)+' menit.');
    };
  }

  /* ---------- TAB: Waktu Stop Diizinkan (dipindah dari Pengaturan) ---------- */
  function drawWaktuStop(mount){
    mount.innerHTML += `
      <div class="card">
        <div class="card-title">Waktu Stop yang Diizinkan (Bukan Downtime) <span class="hint">Berlaku global untuk semua mesin &amp; produk</span></div>
        <p style="font-size:12.5px;color:var(--ink-200);margin-bottom:12px;line-height:1.55;">
          Waktu berhenti yang memang direncanakan — misalnya istirahat/sholat atau briefing awal shift —
          bukan kegagalan mesin. Total menit di bawah ini otomatis <b>dikurangi dari Planned Time</b> setiap
          input OEE sebelum Availability dihitung, dan <b>tidak</b> tercatat sebagai downtime.
        </p>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Nama</th><th>Durasi (mnt)</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="allowedStopBody"></tbody>
        </table></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px;">
          ${canEditSettings?`<button class="btn btn-ghost btn-sm" id="addAllowedStopBtn">+ Tambah Waktu Stop</button>`:'<span></span>'}
          <span class="pill good" id="allowedStopTotal"></span>
        </div>
        ${!canEditSettings?`<p style="font-size:12px;color:var(--ink-400);margin-top:10px;">Hanya Manager yang dapat mengubah data Waktu Stop Diizinkan.</p>`:''}
      </div>
    `;
    renderAllowedStops();
    if(canEditSettings) document.getElementById('addAllowedStopBtn').onclick = ()=>openAllowedStopForm(null);
  }
  function renderAllowedStops(){
    const list = DB.settings.allowedStops || [];
    document.getElementById('allowedStopBody').innerHTML = list.length ? list.map(s=>`
      <tr>
        <td>${escapeHtml(s.nama)}</td>
        <td class="num">${fmtNum(s.durasiMenit,0)}</td>
        <td><span class="pill ${s.aktif!==false?'good':''}">${s.aktif!==false?'Aktif':'Nonaktif'}</span></td>
        <td><div class="row-actions">
          ${canEditSettings?`<button class="icon-btn" data-eas="${s.id}" title="Edit">✎</button><button class="icon-btn del" data-das="${s.id}" title="Hapus">🗑</button>`:''}
        </div></td>
      </tr>`).join('') : `<tr class="empty-row"><td colspan="4">Belum ada waktu stop yang diizinkan.</td></tr>`;
    document.getElementById('allowedStopTotal').textContent = 'Total aktif: '+fmtNum(totalAllowedStopMinutes(),0)+' menit/shift';
    document.querySelectorAll('[data-eas]').forEach(b=>b.onclick=()=>openAllowedStopForm(b.dataset.eas));
    document.querySelectorAll('[data-das]').forEach(b=>b.onclick=()=>{
      if(!confirm('Hapus waktu stop ini?')) return;
      DB.settings.allowedStops = DB.settings.allowedStops.filter(x=>x.id!==b.dataset.das);
      saveDB(); renderAllowedStops(); toast('Dihapus.');
    });
  }
  function openAllowedStopForm(id){
    const editing = !!id;
    const row = editing ? DB.settings.allowedStops.find(x=>x.id===id) : {aktif:true};
    const jamAwal = Math.floor((row.durasiMenit||0)/60), menitAwal = (row.durasiMenit||0)%60;
    openModal((editing?'Edit ':'Tambah ')+'Waktu Stop yang Diizinkan', `
      <form id="asForm">
        <div class="form-grid">
          <div class="field full"><label>Nama *</label><input name="nama" value="${escapeHtml(row.nama||'')}" required placeholder="mis. Istirahat / Sholat"></div>
          <div class="field"><label>Jam</label><input type="number" min="0" id="asJam" value="${jamAwal}"></div>
          <div class="field"><label>Menit</label><input type="number" min="0" max="59" id="asMenit" value="${menitAwal}"></div>
          <div class="field full" style="background:var(--ink-850);border-radius:6px;padding:9px 12px;">
            <span style="font-size:12.5px;color:var(--ink-200);">🧮 Total: <b id="asTotalDisplay">${fmtNum(row.durasiMenit||0,0)}</b> menit</span>
          </div>
          <input type="hidden" name="durasiMenit" id="asDurasiHidden" value="${row.durasiMenit??0}">
          <div class="field"><label>Status</label><select name="aktif"><option value="true" ${row.aktif!==false?'selected':''}>Aktif</option><option value="false" ${row.aktif===false?'selected':''}>Nonaktif</option></select></div>
        </div>
        <p style="font-size:12px;color:var(--ink-200);margin-top:6px;">Berlaku untuk semua mesin dan semua produk — tidak perlu dipilih per item.</p>
        <div class="form-actions"><button type="button" class="btn btn-ghost" id="cancelAsBtn">Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div>
      </form>`);
    document.getElementById('cancelAsBtn').onclick = closeModal;
    function updateAsTotal(){
      const j = parseFloat(document.getElementById('asJam').value)||0;
      const m = parseFloat(document.getElementById('asMenit').value)||0;
      const total = j*60+m;
      document.getElementById('asTotalDisplay').textContent = fmtNum(total,0);
      document.getElementById('asDurasiHidden').value = total;
    }
    document.getElementById('asJam').oninput = updateAsTotal;
    document.getElementById('asMenit').oninput = updateAsTotal;
    document.getElementById('asForm').onsubmit = (e)=>{
      e.preventDefault();
      updateAsTotal();
      const fd = new FormData(e.target);
      const obj = editing ? row : {id:uid()};
      obj.nama = fd.get('nama');
      obj.durasiMenit = parseFloat(fd.get('durasiMenit'))||0;
      obj.aktif = fd.get('aktif')==='true';
      if(!editing) DB.settings.allowedStops.push(obj);
      saveDB(); closeModal(); renderAllowedStops(); toast('Waktu stop disimpan. Total: '+fmtNum(obj.durasiMenit,0)+' menit.');
    };
  }

  function draw(){
    mount.innerHTML = '';
    mount.innerHTML = renderTabs();
    wireTabs();
    if(activeTab==='produksi') drawProduksi(mount);
    else if(activeTab==='waktuKerja') drawWaktuKerja(mount);
    else if(activeTab==='waktuStop') drawWaktuStop(mount);
  }
  draw();
};

PAGE_RENDERERS.downtime = function(mount){
  const canEdit = can('downtime','edit');
  let filterMesin='', filterCat='';
  function getRows(){
    let rows = DB.downtime.slice().sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
    if(filterMesin) rows = rows.filter(r=>r.mesinId===filterMesin);
    if(filterCat) rows = rows.filter(r=>r.kategori===filterCat);
    return rows;
  }
  function renderTable(){
    const rows = getRows();
    const body = rows.length ? rows.map(r=>`<tr>
        <td>${fmtDate(r.tanggal)}</td><td>${escapeHtml(r.shift)}</td><td>${escapeHtml(mesinName(r.mesinId))}</td>
        <td><span class="pill warn">${escapeHtml(r.kategori)}</span></td>
        <td class="num">${fmtNum(r.durasiMenit,0)}</td>
        <td>${escapeHtml(r.keterangan||'–')}</td>
        <td><div class="row-actions">${canEdit?`<button class="icon-btn" data-edit="${r.id}">✎</button><button class="icon-btn del" data-del="${r.id}">🗑</button>`:''}</div></td>
      </tr>`).join('') : `<tr class="empty-row"><td colspan="7">Tidak ada data downtime.</td></tr>`;
    document.getElementById('dtTableBody').innerHTML = body;
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      if(!confirm('Hapus record downtime ini?')) return;
      DB.downtime = DB.downtime.filter(x=>x.id!==b.dataset.del);
      saveDB(); renderTable(); toast('Data dihapus.');
    });
  }
  function openForm(id){
    const editing = !!id;
    const row = editing ? DB.downtime.find(x=>x.id===id) : {tanggal:todayStr(), shift:DB.shiftMaster[0]?.nama||''};
    openModal((editing?'Edit ':'Tambah ')+'Downtime', `
      <form id="dtForm">
        <div class="form-grid">
          <div class="field"><label>Tanggal *</label><input type="date" name="tanggal" value="${row.tanggal||todayStr()}" required></div>
          <div class="field"><label>Shift *</label><select name="shift" required>${DB.shiftMaster.map(s=>`<option value="${escapeHtml(s.nama)}" ${row.shift===s.nama?'selected':''}>${escapeHtml(s.nama)}</option>`).join('')}</select></div>
          <div class="field"><label>Mesin *</label><select name="mesinId" required>${DB.mesin.map(m=>`<option value="${m.id}" ${row.mesinId===m.id?'selected':''}>${escapeHtml(m.nama)}</option>`).join('')}</select></div>
          <div class="field"><label>Kategori *</label><select name="kategori" required>${DB.settings.downtimeCategories.map(c=>`<option value="${escapeHtml(c)}" ${row.kategori===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div>
          <div class="field"><label>Durasi (menit) *</label><input type="number" name="durasiMenit" value="${row.durasiMenit??0}" required></div>
          <div class="field full"><label>Keterangan</label><input type="text" name="keterangan" value="${escapeHtml(row.keterangan||'')}"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelDtBtn">Batal</button>
          <button type="submit" class="btn btn-primary">${editing?'Simpan Perubahan':'Tambah Data'}</button>
        </div>
      </form>
    `);
    document.getElementById('cancelDtBtn').onclick = closeModal;
    document.getElementById('dtForm').onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const obj = editing ? row : {id:uid()};
      ['tanggal','shift','mesinId','kategori','keterangan'].forEach(f=> obj[f]=fd.get(f));
      obj.durasiMenit = parseFloat(fd.get('durasiMenit'))||0;
      if(!editing) DB.downtime.push(obj);
      saveDB(); closeModal(); renderTable(); toast(editing?'Perubahan disimpan.':'Downtime ditambahkan.');
    };
  }
  mount.innerHTML = `
    <div class="toolbar">
      <div class="toolbar-left">
        <select class="select-sm" id="fdMesin"><option value="">Semua Mesin</option>${DB.mesin.map(m=>`<option value="${m.id}">${escapeHtml(m.nama)}</option>`).join('')}</select>
        <select class="select-sm" id="fdCat"><option value="">Semua Kategori</option>${DB.settings.downtimeCategories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select>
      </div>
      ${canEdit?`<button class="btn btn-primary btn-sm" id="addDtBtn">+ Tambah Downtime</button>`:''}
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Tanggal</th><th>Shift</th><th>Mesin</th><th>Kategori</th><th>Durasi (mnt)</th><th>Keterangan</th><th>Aksi</th></tr></thead>
      <tbody id="dtTableBody"></tbody>
    </table></div>
  `;
  renderTable();
  document.getElementById('fdMesin').onchange = e=>{filterMesin=e.target.value; renderTable();};
  document.getElementById('fdCat').onchange = e=>{filterCat=e.target.value; renderTable();};
  if(canEdit) document.getElementById('addDtBtn').onclick = ()=>openForm(null);
};

let dashCharts = {};
function destroyDashCharts(){ Object.values(dashCharts).forEach(c=>c && c.destroy()); dashCharts={}; }

function kpiClass(val, target){
  if(val>=target) return 'kpi-good';
  if(val>=target*0.85) return 'kpi-warn';
  return 'kpi-bad';
}

PAGE_RENDERERS.dashboard = function(mount){
  const def = last30DaysRange();
  let from = def.from, to = def.to, mesinF='', produkF='';

  function draw(){
    const rows = filterOee({from,to,mesinId:mesinF||null, produkId:produkF||null});
    const agg = aggregateOee(rows);
    const dt = filterDowntime({from,to,mesinId:mesinF||null});
    const targets = DB.settings.oeeTargets;

    mount.innerHTML = `
      <div class="toolbar">
        <div class="toolbar-left">
          <input type="date" class="select-sm" id="dFrom" value="${from}">
          <span style="color:var(--ink-400);font-size:12px;">s/d</span>
          <input type="date" class="select-sm" id="dTo" value="${to}">
          <select class="select-sm" id="dMesin"><option value="">Semua Mesin</option>${DB.mesin.map(m=>`<option value="${m.id}" ${mesinF===m.id?'selected':''}>${escapeHtml(m.nama)}</option>`).join('')}</select>
          <select class="select-sm" id="dProduk"><option value="">Semua Produk</option>${DB.produk.map(p=>`<option value="${p.id}" ${produkF===p.id?'selected':''}>${escapeHtml(p.kode)}</option>`).join('')}</select>
        </div>
        <span class="pill">${rows.length} shift entry</span>
      </div>

      <div class="kpi-grid">

/* =====================================================
   PEMUATAN CHART.JS DENGAN CDN CADANGAN
   Beberapa jaringan kantor/operator memblokir cdnjs.cloudflare.com secara
   spesifik. Coba beberapa CDN populer secara berurutan sebelum menyerah.
===================================================== */
const CHART_CDN_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
  'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
  'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js',
];
function loadScriptOnce(url, timeoutMs){
  return new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = url;
    let done = false;
    const timer = setTimeout(()=>{ if(!done){ done=true; reject(new Error('timeout memuat '+url)); } }, timeoutMs||8000);
    s.onload = ()=>{ if(!done){ done=true; clearTimeout(timer); resolve(); } };
    s.onerror = ()=>{ if(!done){ done=true; clearTimeout(timer); reject(new Error('gagal memuat '+url)); } };
    document.head.appendChild(s);
  });
}
let _chartLoadPromise = null;
function ensureChartJs(){
  if(typeof Chart !== 'undefined') return Promise.resolve(true);
  if(_chartLoadPromise) return _chartLoadPromise;
  _chartLoadPromise = (async ()=>{
    for(const url of CHART_CDN_URLS){
      try{
        await loadScriptOnce(url);
        if(typeof Chart !== 'undefined') return true;
      }catch(e){ console.warn('CDN Chart.js gagal:', e.message); }
    }
    _chartLoadPromise = null; // izinkan dicoba lagi lain kali (mis. tombol Coba Lagi)
    return false;
  })();
  return _chartLoadPromise;
}
// Mulai memuat di latar belakang sedini mungkin, tidak menunggu proses lain.
ensureChartJs();

/* Membuat grafik dengan pengaman: kalau Chart.js belum termuat atau construction
   gagal (mis. masalah jaringan), tampilkan pesan yang jelas alih-alih kotak kosong,
   dan JANGAN sampai menjatuhkan proses lain (termasuk Insight AI). Bila Chart.js
   masih dalam proses dimuat lewat CDN cadangan, halaman otomatis dirender ulang
   begitu berhasil — tanpa perlu tindakan dari pengguna. */
function renderChartSafe(canvasId, label, config){
  const el = document.getElementById(canvasId);
  if(!el) return null;
  if(typeof Chart === 'undefined'){
    console.warn('Chart.js belum termuat saat membuat grafik "'+label+'" — mencoba CDN cadangan…');
    showChartFallback(el, label, 'Memuat pustaka grafik dari CDN cadangan…', true);
    ensureChartJs().then(ok=>{
      if(ok && (CURRENT_PAGE==='dashboard' || CURRENT_PAGE==='laporan')){ navigate(CURRENT_PAGE); }
      else if(!ok){ showChartFallback(el, label, 'Semua CDN gagal dijangkau — kemungkinan diblokir jaringan/firewall. Coba tombol di bawah atau ganti jaringan.', false); }
    });
    return null;
  }
  try{
    return new Chart(el, config);
  }catch(err){
    console.error('Gagal membuat grafik "'+label+'":', err);
    showChartFallback(el, label, err.message||String(err), false);
    return null;
  }
}
function showChartFallback(canvasEl, label, reason, isLoading){
  const box = canvasEl.closest ? (canvasEl.closest('.chart-box') || canvasEl.parentElement) : canvasEl.parentElement;
  if(!box) return;
  box.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--ink-400);text-align:center;padding:14px;">
    <span style="font-size:20px;">${isLoading?'⏳':'⚠️'}</span>
    <span style="font-size:12px;font-family:var(--font-mono);">Grafik "${escapeHtml(label)}" ${isLoading?'sedang dimuat…':'tidak dapat dimuat'}</span>
    <span style="font-size:11px;">${escapeHtml(reason)}</span>
    ${isLoading?'':`<button type="button" class="btn btn-ghost btn-sm" onclick="retryCharts()">↺ Coba Lagi</button>`}
  </div>`;
}
function retryCharts(){
  _chartLoadPromise = null;
  ensureChartJs().then(ok=>{
    if(ok){ toast('Grafik berhasil dimuat.'); navigate(CURRENT_PAGE); }
    else{ toast('Masih gagal menjangkau CDN grafik. Periksa koneksi/firewall jaringan.', true); }
  });
}


function chartOptsLine(){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#585373', font:{size:10.5}, boxWidth:12}}},
    scales:{
      x:{ticks:{color:'#585373', font:{size:10}, maxRotation:40}, grid:{color:'rgba(36,31,61,.07)'}},
      y:{min:0, max:100, ticks:{color:'#585373', font:{size:10}, callback:v=>v+'%'}, grid:{color:'rgba(36,31,61,.07)'}}
    }
  };
}
function chartOptsBar(){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{ticks:{color:'#585373', font:{size:10}}, grid:{display:false}},
      y:{min:0, max:100, ticks:{color:'#585373', font:{size:10}, callback:v=>v+'%'}, grid:{color:'rgba(36,31,61,.07)'}}
    }
  };
}
